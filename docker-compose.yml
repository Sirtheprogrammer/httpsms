services:
  httpsms-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: httpsms-gateway
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - PORT={PORT:-8080}
      - DB_PATH=/app/data/httpsms.db
      - OTA_DIR=/app/data/ota
      - WEB_DIR=/app/web
      # Encrypts users' AI provider keys. If unset, a key is generated in ./data/secret.key;
      # back that file up — losing it makes stored keys unreadable.
      - SECRET_KEY=${SECRET_KEY:-}
      # Optional legacy admin API secret (acts as the first admin). Leave empty to disable.
      - MASTER_SECRET=${MASTER_SECRET:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
