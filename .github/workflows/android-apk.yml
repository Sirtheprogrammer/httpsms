name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      # Kotlin 2.0.0 can't run on JDK 25, so pin a JDK 17 toolchain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; refusing to publish an APK that can't update existing installs."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Every release is signed with the same permanent key, so new versions
      # install over old ones without uninstalling.
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-configuration-cache

      - name: Prepare release info
        id: info
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          tag="apk-v${version}-build.${{ github.run_number }}"
          apk="httpsms-gateway-${version}-build.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk=android/$apk" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.info.outputs.apk }}

      - name: Publish GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.info.outputs.tag }}" \
            "${{ steps.info.outputs.apk }}" \
            --target "${{ github.sha }}" \
            --title "Android ${{ steps.info.outputs.version }} (build ${{ github.run_number }})" \
            --notes "Signed APK built from ${{ github.sha }}. Installs over any earlier build from 1.2.1 onward." \
            --latest
